<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Sayfa Başlığı (Google Arama Sonucundaki Mavi Başlık) -->
    <title>Fatih Ertem - Developer</title>

    <meta name="keywords" content="fatih ertem, fatih, ertem, python, developer, open source, cloudflare, cloudflare workers, mail, chat, file encrypt" />
    <meta name="description" content="Personal portfolio of a hobbyist developer exploring modern technologies. Check out my coding projects, web experiments, and creative software built for fun." />

    <!-- Google'a Site Adınızı Tanımlayan Yapısal Veri (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Fatih Ertem",
      "url": "https://fatihertem.com/"
    }
    </script>

    <!-- Open Graph (Sosyal Medya ve Google Site Adı Desteği) -->
    <meta property="og:site_name" content="Fatih Ertem">
    <meta property="og:title" content="Fatih Ertem - Personal Portfolio">
    <meta property="og:description" content="Personal portfolio of a hobbyist developer exploring modern technologies.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://fatihertem.com/">

    <!-- Favicon Ayarları (Mutlak Yol / Absolute Path) -->
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <!-- Mümkünse 48x48 veya 192x192 piksellik bir PNG favicon da ekleyin: -->
    <!-- <link rel="icon" type="image/png" sizes="48x48" href="/assets/images/favicon-48x48.png"> -->
    <link rel="apple-touch-icon" href="/assets/images/favicon.ico">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>

    <link rel="stylesheet" href="/assets/vendor.css">
